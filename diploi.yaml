diploiVersion: v1.0

components:
  - name: voi
    identifier: voi
    package: https://github.com/diploi/component-nextjs#main
    hosts:
      - identifier: web
        name: voi
        port: 3000
    env:
      include:
        - postgres.DATABASE_URL

addons:
  - name: PostgreSQL
    identifier: postgres
    package: https://github.com/diploi/addon-postgres#main
